<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Хаттама AI — транскрипция совещаний, протоколы и поручения. / Хаттама AI — кездесу транскрипциясы, хаттама және тапсырмалар." />
    <title>Хаттама AI — протоколы встреч / кездесу хаттамалары</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#app">Мазмұнға өту / К содержимому</a>
    <header class="sidebar">
      <a class="brand" href="#meetings" aria-label="Хаттама AI — главная">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="11" fill="#0D9488"/>
          <rect x="9" y="9.5" width="15" height="4.5" rx="2.25" fill="#ffffff"/>
          <rect x="16" y="17.5" width="15" height="4.5" rx="2.25" fill="#BFF7EF"/>
          <rect x="9" y="25.5" width="12" height="4.5" rx="2.25" fill="#BFF7EF"/>
          <path d="M28.5 27.5l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6z" fill="#F59E0B"/>
        </svg>
        <span class="brand-text">Хаттама<em>AI</em></span>
      </a>
      <p class="brand-caption" id="brand-caption">Кездесуден — нәтижеге</p>
      <nav aria-label="Navigation">
        <button data-nav="meetings" aria-label="Совещания / Кездесулер">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h12"/></svg><span>Кездесулер</span>
        </button>
        <button data-nav="tasks" aria-label="Поручения / Тапсырмалар">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l3 3 6-7"/><path d="M4 4h2M4 12h2M4 20h2"/></svg><span>Тапсырмалар</span>
        </button>
        <button data-nav="settings" aria-label="Настройки / Баптаулар">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6l1.6 3 3.4-.8 1.1 3.3 3.3 1.1-.8 3.4 3 1.6-3 1.6.8 3.4-3.3 1.1-1.1 3.3-3.4-.8-1.6 3-1.6-3-3.4.8-1.1-3.3L2.6 20l.8-3.4-3-1.6 3-1.6-.8-3.4L5.9 8.9 7 5.6l3.4.8z"/></svg><span>Баптаулар</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="sidebar-note">
          <span class="status-dot" aria-hidden="true"></span>
          <strong id="workspace-label">Жұмыс кеңістігі</strong>
          <small id="workspace-caption">Транскрипт · Хаттама · Тапсырмалар</small>
        </div>
        <button id="locale" aria-label="Switch language">RU</button>
      </div>
    </header>
    <main>
      <div id="message" role="status" aria-live="polite"></div>
      <div id="app" tabindex="-1"></div>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
